<!DOCTYPE html>
<html>
<head>
    <title>Editar Proyectos</title>
    <link rel="stylesheet" href="/css/editar.css"> <!-- Ruta del CSS -->
</head>
<body>
	<div class="container mt-5">
		<h2>Formulario de Proyectos</h2>
<form th:action="@{/guardarProyecto}" method="post" th:object="${nuevo}">
    <!-- Campo para el ID (oculto) -->
    <input type="hidden" th:field="*{id}">

    <!-- Campo para el Nombre del Proyecto -->
    <div class="form-group">
        <label for="nombreProyectos">Nombre del Proyecto:</label>
        <input type="text" class="form-control" id="nombreProyectos" name="nombreProyectos" 
               placeholder="Ingrese el nombre del proyecto" th:value="*{nombreProyectos}" required>
    </div>

    <!-- Campo para la Descripción -->
    <div class="form-group">
        <label for="descripcion">Descripción:</label>
        <textarea class="form-control" id="descripcion" name="descripcion" 
                  placeholder="Ingrese una descripción" rows="3" th:field="*{descripcion}" required></textarea>
    </div>

    <!-- Campo para la Fecha de Inicio -->
    <div class="form-group">
        <label for="fechaInicio">Fecha de Inicio:</label>
        <input type="date" class="form-control" id="fechaInicio" name="fechaInicio" 
               th:value="*{fechaInicio}" required>
    </div>

    <!-- Campo para la Fecha de Fin -->
    <div class="form-group">
        <label for="fechaFin">Fecha de Fin:</label>
        <input type="date" class="form-control" id="fechaFin" name="fechaFin" 
               th:value="*{fechaFin}" required>
    </div>

    <!-- Campo para el Estado -->
    <div class="form-group">
        <label for="estado">Estado:</label>
        <select class="form-control" id="estado" name="estado" th:field="*{estado}" required>
            <option value="Pendiente" th:selected="*{estado == 'Pendiente'}">Pendiente</option>
            <option value="En Progreso" th:selected="*{estado == 'En Progreso'}">En Progreso</option>
            <option value="Completado" th:selected="*{estado == 'Completado'}">Completado</option>
        </select>
    </div>

    <!-- Botón de envío -->
    <button type="submit" class="btn btn-primary">Guardar Proyecto</button>
    <button type="button" class="btn btn-secondary"
				onclick="window.location.href='/proyectosTable';">Cancelar</button>
</form>
	</div>
</body>
</html>
