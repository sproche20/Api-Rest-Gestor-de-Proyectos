<!DOCTYPE html>
<html class="fixed" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{plantilla}">
<head>
    <title>Lista de Usuarios</title>
</head>
<body>
<div layout:fragment="Contenidohtml">
    <div class="container mt-5">
        <h2>Lista de Usuarios</h2>
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre de Usuario</th>
                    <th>Correo Electrónico</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${listaUsuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.nombreUser}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.rol}"></td>
   <td>
    <a class="btn btn-warning btn-sm" th:href="@{/editarUsuario/}+${usuario.id}">Editar</a>
    <a th:href="@{/eliminarUsuario/{id}(id=${usuario.id})}" 
       class="btn btn-danger btn-sm" 
       onclick="return confirm('¿Estás seguro de eliminar este usuario?')">Eliminar</a>
</td>

                </tr>
            </tbody>
        </table>
        <a href="/userForm" class="btn btn-primary">Nuevo Usuario</a>
    </div>
</div>
</body>
</html>
