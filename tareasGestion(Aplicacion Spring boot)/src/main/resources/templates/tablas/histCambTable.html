<!DOCTYPE html>
<html class="fixed" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{plantilla}">
<head>
    <title>Historial de Cambios</title>
</head>
<body>
<div layout:fragment="Contenidohtml">
    <div class="container mt-5">
        <h2>Historial de Cambios</h2>
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Tipo de Cambio</th>
                    <th>Fecha de Cambio</th>
                    <th>Descripción</th>
                    <th>Proyecto</th>
                    <th>Usuario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="histCambio : ${listaHistCambios}">
                    <td th:text="${histCambio.id}"></td>
                    <td th:text="${histCambio.tipocambio}"></td>
                    <td th:text="${histCambio.fechacambio}"></td>
                    <td th:text="${histCambio.descripcion}"></td>
                    <td th:text="${histCambio.fkProyectos != null ? histCambio.fkProyectos.nombreProyectos : 'Sin Proyecto Asociado'}"></td>
					<td th:text="${histCambio.fkUser != null ? histCambio.fkUser.nombreUser : 'Sin Usuario Asociado'}"></td>

                    <td>
                        <a th:href="@{/editarHistCamb/}+${histCambio.id}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/eliminarHistCamb/{id}(id=${histCambio.id})}" 
                           class="btn btn-danger btn-sm" 
                           onclick="return confirm('¿Estás seguro de eliminar este cambio?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/histCambiosForm" class="btn btn-primary">Nuevo Cambio</a>
    </div>
</div>
</body>
</html>
