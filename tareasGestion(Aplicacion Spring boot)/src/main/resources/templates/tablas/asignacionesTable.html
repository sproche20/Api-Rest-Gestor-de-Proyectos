<!DOCTYPE html>
<html class="fixed" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{plantilla}">
<head>
    <title>Lista de Asignaciones</title>
</head>
<body>
<div layout:fragment="Contenidohtml">
    <div class="container mt-5">
        <h2>Lista de Asignaciones</h2>
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Fecha de Asignación</th>
                    <th>Usuario</th>
                    <th>Tarea</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="asignacion : ${listaAsignaciones}">
                    <td th:text="${asignacion.id}"></td>
                    <td th:text="${asignacion.fechaasing}"></td>
                    <td th:text="${asignacion.fkUser != null ? asignacion.fkUser.nombreUser : 'Sin Usuario Asignado'}"></td>
					<td th:text="${asignacion.fkTareas != null ? asignacion.fkTareas.nombreTarea : 'Sin Tarea Asignada'}"></td>

                    <td>
                        <a th:href="@{/editarAsignacion/}+${asignacion.id}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/eliminarAsignacion/{id}(id=${asignacion.id})}" 
                           class="btn btn-danger btn-sm" 
                           onclick="return confirm('¿Estás seguro de eliminar esta asignación?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/asignacionesForm" class="btn btn-primary">Nueva Asignación</a>
    </div>
</div>
</body>
</html>
