<!DOCTYPE html>
<html class="fixed" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{plantilla}">
<head>
    <title>Lista de Tareas</title>
</head>
<body>
<div layout:fragment="Contenidohtml">
    <div class="container mt-5">
        <h2>Lista de Tareas</h2>
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre de la Tarea</th>
                    <th>Descripción</th>
                    <th>Fecha de Inicio</th>
                    <th>Fecha de Fin</th>
                    <th>Estado</th>
                    <th>Proyecto Asociado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tarea : ${listaTareas}">
                    <td th:text="${tarea.id}"></td>
                    <td th:text="${tarea.nombreTarea}"></td>
                    <td th:text="${tarea.descripcion}"></td>
                    <td th:text="${tarea.fechaInicio}"></td>
                    <td th:text="${tarea.fechaFin}"></td>
                    <td th:text="${tarea.estado}"></td>
                    <td th:text="${tarea.fkProyectos != null ? tarea.fkProyectos.nombreProyectos : 'Sin Proyecto Asociado'}"></td>
                    <td>
                        <a  class="btn btn-warning btn-sm" th:href="@{/editarTareas/}+${tarea.id}" >Editar</a>
                        <a th:href="@{/eliminarTarea/{id}(id=${tarea.id})}" 
                           class="btn btn-danger btn-sm" 
                           onclick="return confirm('¿Estás seguro de eliminar esta tarea?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <a href="/tareasForm" class="btn btn-primary">Nueva Tarea</a>
    </div>
</div>
</body>
</html>
