<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{plantilla}">
<head>
    <title>Formulario de Usuario</title>
</head>
<body>
<div layout:fragment="Contenidohtml"> 
    <div class="container mt-5">
        <h2>Formulario de Usuario</h2>
        <form th:action="@{/guardarUsuario}" method="post" th:object="${nuevo}">
            <div class="form-group">
                <label for="nombreUser">Nombre de Usuario:</label>
                <input type="text" class="form-control" id="nombreUser" name="nombreUser" placeholder="Ingrese el nombre" th:value="*{nombreUser}" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Ingrese el correo" th:value="*{email}" required>
            </div>
            <div class="form-group">
                <label for="rol">Rol:</label>
                <select class="form-control" id="rol" name="rol" th:value="*{rol}" required>
                    <option value="Admin">Administrador</option>
                    <option value="User">Usuario</option>
                    <option value="Manager">Gerente</option>
                </select>
            </div>
            <input type="hidden" th:field="*{id}">
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</div>

</body>
</html>
